name: POPPER-Swarm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run POPPER e-value and BixBench3 falsification test suite
        run: |
          pytest -q

      - name: Verify POPPER benchmark CLI and ledger integrity
        run: |
          bash benchmark_scripts/run_bixbench3.sh
