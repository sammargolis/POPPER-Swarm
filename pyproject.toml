[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popper-swarm"
version = "0.1.0"
description = "POPPER-Swarm: Falsification-Driven AI Scientist Swarm for BixBench3 with Exa and past.dev"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.102.0",
    "bixbench3",
    "exa-py>=2.28.0",
    "fastapi>=0.115.0",
    "google-genai>=2.2.0",
    "gseapy>=1.3.2",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30.0",
    "inspect-ai>=0.3.220",
    "numpy>=2.0.0",
    "openai>=2.36.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pydeseq2>=0.5.4",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
popper-swarm = "popper_swarm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/popper_swarm"]

[tool.uv.sources]
bixbench3 = { path = "vendor/BixBench3", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]
